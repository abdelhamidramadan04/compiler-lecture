dcon(el){const st=[[`Start state <b>A = firstpos(root) = {1,2,3}</b>.`,{u:0,hn:['A']}]];DR.D.forEach((d,i)=>{const L=DR.log.filter(l=>l[0]==d.n).map(l=>`on <b>${l[1]}</b>: positions ${fs(l[2])} carry ${l[1]} → ∪ followpos = <span class="l">${fs(l[3])}</span> = <b>${l[4]}</b>${l[5]?' (new)':''}`);st.push([`<b>Process ${d.n}</b> = ${fs(d.s)}${d.s.includes(6)?' — contains position 6 (#) ⇒ accepting':''}<br>${L.join('<br>')}`,{u:i+1,hn:[d.n],he:D4.e.map((e,k)=>e[0]==d.n?k:-1).filter(k=>k>=0)}])});st.push(['No new state: done. Diagram = table above.',{hn:D4.acc}]);GS(el,D4,st,{u:-1},0)},

min(el){const a=ei(D4,'A','A'),b=ei(D4,'B','C'),c=ei(D4,'C','D');GS(el,D4,[['<b>P<sub>0</sub> = {{D}, {A,B,C}}</b> — accepting vs non-accepting.',{hn:['D']}],['Test {A,B,C}. On a all three go to B (same group). On b: A→A, B→C stay in {A,B,C}, but <b>C→D</b> enters {D}. So C separates: <b>P<sub>1</sub> = {{D}, {C}, {A,B}}</b>.',{hn:['C'],he:[c]}],['Test {A,B}. On b: <b>A→A</b> (group {A,B}) but <b>B→C</b> (group {C}). Different groups ⇒ A and B split: <b>P<sub>2</sub> = {{D},{C},{A},{B}}</b>.',{hn:['A','B'],he:[a,b]}],['<span class="ok">P<sub>2</sub> is stable: four singleton groups, so the four states are pairwise distinguishable. The DFA is already minimal; the state count stays 4.</span>',{hn:['A','B','C','D']}]],{hn:[]},0)},

flow(el){ST(el,[row(['Regular Expression','Thompson’s Construction','NFA','Subset Construction','DFA','DFA Optimization']),row(['Regular Expression','Augmented Syntax Tree','Position calculations','Direct DFA']),'Route 1 builds an intermediate NFA. Route 2 works with <b>positions</b> in the syntax tree of r# and never builds the NFA.'],0,1)},

['Which statement about NFAs and DFAs is correct?',['NFAs recognize more languages than DFAs','DFAs recognize more languages than NFAs','They recognize exactly the same class: the regular languages','NFAs can only recognize finite languages'],2,'Every NFA has an equivalent DFA (subset construction), so the two models are equal in recognition power. NFAs are just more compact or convenient.'],

['When is a DFA state produced by subset construction accepting?',['When it contains at least one NFA accepting state','When it contains only NFA accepting states','When it is the start state','When it has no outgoing transitions'],0,'The DFA state is a set of NFA states; one accepting member is enough, because some NFA path then accepts.'],
['How many new states does Thompson’s rule for r* add?',['0','1','2','4'],2,'A new start and a new accept state; the four ε-edges enter, leave, skip and repeat.'],

// ---- slides
add(0,'',`<h1>Automata and Pattern Matchers</h1><p>Compiler Design · Lecture 3 · Aho, Sethi, Ullman, <i>Compilers: Principles, Techniques, and Tools</i>, Ch. 3, §3.6–3.9 (pp. 113–146)</p>
<div class="g"><div class="p"><h3>Objectives</h3>Compare NFA and DFA · build NFAs from regular expressions · simulate them · see how Lex combines patterns and finds the longest match · build a DFA directly from a syntax tree · minimize it · compress its table.</div><div class="p"><h3>Roadmap</h3>Part 1 §3.6 → Part 2 §3.7 → Part 3 §3.8 → Part 4 §3.9.</div></div>
<p class="mu">Use ← → keys, the buttons or the section menu. Panels with <b>Next Step</b> buttons are real animations; input boxes let you test your own strings.</p>
<div class="note">Marking: examples are <b>illustrative teaching examples</b> unless stated; textbook page content was not available to me for verification, so I do not claim they are verbatim from the book.</div>`);
add(1,'1 · The mathematical model of a finite automaton',`<p>A finite automaton is a recognizer: it reads the input one symbol at a time and answers yes/no. It has five parts:</p><table><tr><th>Part</th><th>Meaning</th></tr><tr><td>Q</td><td>finite set of <b>states</b></td></tr><tr><td>Σ</td><td>input <b>alphabet</b> (symbols read), e.g. {a,b}</td></tr><tr><td>δ</td><td><b>transition function</b>: (state, symbol) → next state (DFA) or set of states (NFA)</td></tr><tr><td>q<sub>0</sub></td><td>the <b>start state</b></td></tr><tr><td>F ⊆ Q</td><td>set of <b>accepting</b> states (drawn as double circles)</td></tr></table>
<p>The automaton accepts string x if, after consuming all of x, it can be in a state of F. The set of accepted strings is its <b>language</b>.</p><div class="note trap"><b>Don’t confuse</b> states (Q) with symbols (Σ), and δ (the rules) with F (the final answer).</div>`);
add(1,'2 · NFA: graph, table and simulation',`<ul><li>An NFA may have <b>several</b> (or no) transitions from a state on the same symbol, and <b>ε-transitions</b>.</li><li>ε means “move without consuming input” – it is not an input character.</li><li>Accepts x if <b>at least one</b> path labelled x ends in an accepting state. We track the <b>set</b> of states that may be active.</li></ul>
<p><b>Illustrative example:</b> the NFA for (a|b)*abb (dashed = ε, double circle = accepting).</p>${G(NF,{})}${W('ntab')}<p><b>▶ Process an input:</b></p>${W('nsim')}`);
add(1,'3 · ε-closure',`<p><b>ε-closure(s)</b> = s plus every state reachable from s by ε-transitions alone (zero or more). For a set T: the union over its members. <b>move(T,a)</b> = states reachable from T by one a-edge.</p><p><b>▶ Click a state</b> to highlight its closure:</p>${W('clo')}<div class="note tx">Simulation rule: after every symbol take ε-closure(move(S,a)).</div>`);
add(1,'4 · DFA and Algorithm 3.1 (simulating a DFA)',`<p>A DFA has <b>exactly one</b> next state for each (state, symbol) (complete-DFA definition) and <b>no ε-moves</b>; it keeps one current state.</p><pre>s := s<sub>0</sub>;  c := nextchar;
while c ≠ eof do begin  s := move(s, c);  c := nextchar  end;
if s is in F then return "yes" else return "no";</pre><p>Below: the DFA obtained from the NFA in the next slide. Try one accepted and one rejected string.</p>${W('dsim1')}<div class="note">Passing through an accepting state earlier does not matter – only the state after the last symbol.</div>`);
add(1,'5 · Subset construction (Algorithm 3.2)',`<pre>initially, ε-closure(s<sub>0</sub>) is the only state in Dstates, unmarked;
while there is an unmarked state T in Dstates do begin
  mark T;
  for each input symbol a do begin
    U := ε-closure(move(T, a));
    if U is not in Dstates then add U as an unmarked state;
    Dtran[T, a] := U  end end</pre><p>A DFA state is a <b>set of NFA states</b>; it is accepting if it contains an NFA accepting state. All sets below are computed by the page itself.</p>${W('sub')}`);
add(1,'6 · NFA vs DFA: comparison and recap',`<table><tr><th></th><th>NFA</th><th>DFA</th></tr><tr><td>Transitions</td><td>0, 1 or many next states per symbol</td><td>exactly one</td></tr><tr><td>ε-transitions</td><td>allowed</td><td>none</td></tr><tr><td>Active states</td><td>a set (possibly many)</td><td>exactly one</td></tr><tr><td>Processing input</td><td>update a set with closure(move)</td><td>one table lookup per symbol</td></tr><tr><td>Memory / time</td><td>small automaton, slower per symbol</td><td>fast per symbol, up to 2<sup>n</sup> states</td></tr><tr><td>Recognition power</td><td colspan="2"><b>Exactly the regular languages – both equal.</b> An NFA is not more powerful, just more compact/convenient.</td></tr></table><div class="note">Next: how a regular expression becomes an NFA.</div>`);
add(2,'7 · Regular expressions and Thompson’s construction (Algorithm 3.3)',`<div class="g"><div class="p"><h3>Part 1 → Part 2</h3>Part 1 explained what NFAs/DFAs are and how to run them. Part 2 asks: given a regular expression, how do we <b>build</b> an NFA (Algorithm 3.3) and then <b>run</b> it (Algorithm 3.4)?</div><div class="p"><h3>Two different jobs</h3><b>Building</b> creates states and edges from the expression. <b>Running</b> reads an input string and tracks active states. We do them in this order.</div></div><p>Operators: literal symbols, union <code>r|s</code>, concatenation <code>rs</code>, Kleene star <code>r*</code> (zero or more). Thompson’s construction is <b>syntax-directed</b>: build N(r) from the NFAs of the sub-expressions; each fragment has one start and one accepting state.</p>${W('rules')}<div class="note">Dashed edges are ε-transitions; solid edges labelled N(s) or N(t) stand for an already-built sub-automaton from its start to its accept state. Double circle = accepting.</div><p><b>Check:</b> how many new states does the rule for r|s add? for rs? for r*? <span class="mu">(2, 0, 2)</span></p>`);
add(2,'8 · Building (a|b)*abb step by step',`<p><b>Illustrative teaching example (building only – no input is read here).</b> Each stage applies one rule of Algorithm 3.3. Pink states and thick edges are the ones added at the current stage; the explanation is in the card below the diagram.</p>${W('th')}<p><b>Check:</b> which stage adds the edge that allows zero repetitions of (a|b)? <span class="mu">(stage 3: the skip edge 0→7)</span></p>`);
add(2,'9 · Properties of the constructed NFA',`<ul><li>N(r) has exactly one start state and one accepting state; no edge leaves the accepting state.</li><li>At most twice as many states as symbols + operators of r (here 11 states ≤ 2 × (5 symbols + 5 operators)).</li><li>Every state has either one outgoing symbol edge, or at most two outgoing ε-edges.</li></ul><p>These bounds make simulation cost proportional to the size of r.</p>${G(NF,{})}<div class="note tx">This is the finished NFA (same automaton as in Part 1). Next we <b>run</b> it.</div>${W('ver')}`);
add(2,'10 · NFA simulation (Algorithm 3.4) and the two-stack mechanism',`<div class="note"><b>Running, not building:</b> the NFA is already constructed; Algorithm 3.4 only reads input x and tracks the set of active states.</div><p>Algorithm 3.4 simulates N on input x:</p><pre>S := ε-closure({s<sub>0</sub>});  a := nextchar;
while a ≠ eof do begin  S := ε-closure(move(S, a));  a := nextchar  end;
if S ∩ F ≠ ∅ then return "yes" else return "no";</pre><p>Implementation idea: <b>oldStates</b> stack holds the current set S; <b>newStates</b> stack collects the next set; a boolean array <b>alreadyOn</b> prevents pushing a state twice; <code>addState(s)</code> pushes s and follows its ε-edges recursively.</p><p><b>▶ Stack contents</b> (computed by simulating this mechanism; push order depends on edge order):</p>${W('stk')}<div class="note tx">I describe the mechanism from the textbook’s general idea; check exact pseudocode names against §3.7 before quoting.</div><p><b>Check:</b> after reading <code>ab</code>, is state 10 active? <span class="mu">(no – 10 appears only after abb)</span></p>`);
add(2,'11 · Time–space tradeoffs',`<table><tr><th></th><th>NFA simulation</th><th>DFA simulation</th><th>Lazy DFA (on demand)</th></tr><tr><td>Preprocessing</td><td>small (build NFA)</td><td>subset construction, may be large</td><td>almost none</td></tr><tr><td>Space</td><td>O(|r|)</td><td>up to O(2^|r|)</td><td>only states/transitions actually used (cache)</td></tr><tr><td>Time for x</td><td>O(|r|·|x|)</td><td>O(|x|)</td><td>O(|x|) after warm-up, extra work on cache misses</td></tr><tr><td>Repeated use</td><td>pays the same cost every time</td><td>best</td><td>improves as the cache fills</td></tr></table><p>No method is always best: NFA for one-off matches or huge DFAs; DFA for scanners used many times; lazy evaluation as a compromise.</p><p><b>Check:</b> why can a DFA need much more memory than the NFA? <span class="mu">(subset construction may create up to 2<sup>n</sup> states)</span></p>`);
add(2,'12 · Lazy transition evaluation',`<p>Build a DFA state/transition <b>only when the input first needs it</b> and cache it. Repeated input reuses cached transitions.</p>${W('lazy')}`);
add(3,'13 · What is a lexical-analyzer generator?',`<p>A generator reads <b>token patterns and actions</b> and produces a scanner.</p><div class="g"><div class="p"><h3 class="t">Token</h3>category (identifier, keyword, number)</div><div class="p"><h3>Pattern</h3>rule describing the strings that form it (a regular expression)</div><div class="p"><h3 class="l">Lexeme</h3>the actual characters matched in the input</div><div class="p"><h3>Action</h3>code run when a pattern is selected</div></div>${W('p3flow')}<p>Independent teaching example: <code>"if" {return IF;}</code>, <code>[a-z]+ {return ID;}</code>. Regular expressions describe patterns → automata recognize them → the generated scanner runs the automaton over the input.</p>`);
add(3,'14 · Composite automata',`<p>Patterns p<sub>1</sub>|p<sub>2</sub>|⋯|p<sub>n</sub> are handled by <b>one</b> automaton: build an NFA per pattern, add a new start state with <b>ε-transitions</b> to each, and keep each accepting state tagged with its rule.</p><p><b>Illustrative example</b> (patterns a, abb, a*b<sup>+</sup> in the classic style; NFAs simplified):</p>${W('comp')}`);
add(3,'15 · From the combined NFA to a DFA',`<p>Subset construction on the combined NFA. A DFA state is a set of NFA states, possibly from <b>different</b> patterns, so it may contain several accepting states.</p>${W('sdfa')}<div class="note trap">Combining patterns is one step; deciding which rule wins when several match is a separate step (next slides).</div>`);
add(3,'16 · How a scanner finds the longest match',`<p><b>lexemeBegin</b> marks the start of the candidate lexeme; <b>forward</b> advances through transitions; the scanner remembers the <b>last accepting position</b> (lastAcc) and its rule. When no transition remains, it returns the lexeme up to lastAcc and resumes there.</p>${W('scanA')}<div class="note">The first accepting state is not necessarily the end: in <code>abba</code> the match <code>a</code> (A1), then <code>ab</code> (A3), then <code>abb</code> (A2) are all accepting.</div>`);
add(3,'17 · Longest match vs rule priority',`<div class="g"><div class="p"><h3>Rule 1 – longest match</h3>Take the longest prefix matched by <i>any</i> pattern.</div><div class="p"><h3>Rule 2 – priority</h3>If several patterns match the <b>same longest</b> prefix, the one listed <b>first</b> wins.</div></div><p>Order matters: length first, priority only breaks ties.</p>
<h3>Example A (longest match): “=” and “==”</h3>${W('scanB')}<h3>Example B (priority): keyword if vs identifier [a-z]+</h3>${W('scanC')}<p class="mu">Both are illustrative examples. An accepting DFA state remembers which patterns it represents; the scanner picks the action from that information.</p>`);
add(3,'18 · Lookahead and trailing context: the operator /',`<p>For a pattern <code>r<sub>1</sub>/r<sub>2</sub></code>: <b>r<sub>1</sub></b> is the lexeme; <b>r<sub>2</sub></b> is trailing context that must follow but is <b>not part of the lexeme</b>. In the NFA, “/” is an ε-edge. When the accepting state is reached, the end of the lexeme is the position where that ε-edge was crossed – which may be <b>earlier</b> than where scanning stopped, so a plain DFA stop position is not enough. Fortran-style example (<code>IF / \\(.*\\){letter}</code>; independent teaching version, check exact form in §3.8):</p>${W('tc')}<div class="note trap">Cells: yellow = lexeme, pink = examined trailing context. For ambiguous patterns, finding the boundary needs extra bookkeeping; see the book for details.</div>`);
add(3,'19 · Integrated scanner and NFA-vs-DFA scanning',`<table><tr><th>#</th><th>Pattern</th><th>Rule</th></tr><tr><td>1</td><td>if</td><td>IF</td></tr><tr><td>2</td><td>[a-z]+</td><td>ID</td></tr><tr><td>3</td><td>=</td><td>ASSIGN</td></tr><tr><td>4</td><td>==</td><td>EQ</td></tr><tr><td>5</td><td>[0-9]+</td><td>NUM</td></tr><tr><td>6</td><td>blank</td><td>WS (skip)</td></tr></table><p><b>▶ Scan</b> (shows state, accepting positions, conflicts, selected rule, action and resume position):</p>${W('scanD')}
<table><tr><th></th><th>NFA-based scanning</th><th>DFA-based scanning</th></tr><tr><td>Longest match</td><td>track active set; remember last position where it contains an accepting state</td><td>remember last accepting DFA state/position</td></tr><tr><td>Rule priority</td><td>choose first-listed rule among accepting NFA states</td><td>precomputed per accepting DFA state</td></tr><tr><td>Cost</td><td>slower per char, small</td><td>fast per char, larger tables</td></tr></table>`);
I.scanD=el=>IN(el,['if ifx==10','x=5','if x==10'],(s,w)=>SC(s,w,nx2,AC2,{act:ACT,info:INFO2}));
add(4,'20 · Connection to previous parts',`<p><b>▶</b> Two routes from a regular expression to a DFA:</p>${W('flow')}<div class="note">Direct construction builds the DFA from the <b>syntax tree</b> of the augmented expression, without the intermediate NFA.</div>`);
add(4,'21 · Augmented expression and syntax tree',`<p>For r = (a|b)*abb we use <b>r# = (a|b)*abb#</b>. The end-marker # is an extra leaf: a DFA state containing its position is accepting. r matches strings over {a,b} ending in abb (illustrative example).</p><table><tr><th>Position</th><th>Symbol</th><th>Meaning</th></tr><tr><td>1</td><td>a</td><td>first leaf inside (a|b)*</td></tr><tr><td>2</td><td>b</td><td>second leaf inside (a|b)*</td></tr><tr><td>3</td><td>a</td><td>first symbol of suffix abb</td></tr><tr><td>4</td><td>b</td><td>second symbol of suffix</td></tr><tr><td>5</td><td>b</td><td>third symbol of suffix</td></tr><tr><td>6</td><td>#</td><td>end-marker</td></tr></table>${W('tr0')}`);
add(4,'22 · nullable, firstpos, lastpos',`<div class="g"><div class="p"><h3>nullable(n)</h3>can n match ε?</div><div class="p"><h3>firstpos(n)</h3>positions that can be the <i>first</i> symbol</div><div class="p"><h3>lastpos(n)</h3>positions that can be the <i>last</i> symbol</div></div>
<table><tr><th>Node</th><th>nullable</th><th>firstpos</th><th>lastpos</th></tr><tr><td>leaf at position i</td><td>false</td><td>{i}</td><td>{i}</td></tr><tr><td>c<sub>1</sub>|c<sub>2</sub></td><td>n(c<sub>1</sub>) or n(c<sub>2</sub>)</td><td>F(c<sub>1</sub>)∪F(c<sub>2</sub>)</td><td>L(c<sub>1</sub>)∪L(c<sub>2</sub>)</td></tr><tr><td>c<sub>1</sub>·c<sub>2</sub></td><td>n(c<sub>1</sub>) and n(c<sub>2</sub>)</td><td>n(c<sub>1</sub>)? F(c<sub>1</sub>)∪F(c<sub>2</sub>) : F(c<sub>1</sub>)</td><td>n(c<sub>2</sub>)? L(c<sub>1</sub>)∪L(c<sub>2</sub>) : L(c<sub>2</sub>)</td></tr><tr><td>c*</td><td>true</td><td>F(c)</td><td>L(c)</td></tr></table>${W('tr1')}<div class="note">Position 5 is last for the suffix abb alone, but # is appended, so lastpos of the full r# is {6}.</div>`);
add(4,'23 · followpos and Algorithm 3.5 rules',`<p>followpos(i) = positions that can immediately follow position i.</p><div class="g"><div class="p"><h3>Concatenation X·Y</h3>for each i in lastpos(X): add firstpos(Y) to followpos(i)</div><div class="p"><h3>Star X*</h3>for each i in lastpos(X): add firstpos(X) to followpos(i)</div></div>${W('tr2')}`);
add(4,'24 · Constructing the DFA directly',`<p>Start = firstpos(root). A state is a set of positions; for symbol x take the union of followpos(p) over positions p in the state labelled x. A state containing 6 (#) accepts.</p><table><tr><th>State</th><th>Positions</th><th>a</th><th>b</th><th>Accepting?</th></tr>${DR.D.map(d=>`<tr><td>${d.n}${d.s.includes(6)?' ✔':''}</td><td>${fs(d.s)}</td><td>${DR.T[d.n].a}</td><td>${DR.T[d.n].b}</td><td>${d.s.includes(6)?'Yes':'No'}</td></tr>`).join('')}</table>${W('dcon')}<p><b>▶ Simulate</b> (accepted: abb, aabb, babb; rejected: ab, aba, abba):</p>${W('dsim4')}`);
add(4,'25 · DFA minimization (Algorithm 3.6)',`<p>Goal: merge equivalent states without changing the language. Partition refinement: split accepting/non-accepting; split a group when its states go to different groups on some symbol; repeat until stable.</p>${W('min')}<div class="note">Minimization does not always reduce states: here it keeps 4. (The 5-state DFA from Part 1 would shrink: A and C have identical rows.)</div>`);
add(5,'26 · Review quiz: 10 questions on Parts 1–4',`<p>Click an answer. The explanation appears below the question; use Next to move on and see your score at the end.</p>${W('quiz')}`);
